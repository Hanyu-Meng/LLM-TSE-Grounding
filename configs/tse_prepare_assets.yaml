project_root: .

environments:
  wesep: wesep
  cosyvoice: cosyvoice
  generator: pytorch_env

assets:
  wesep_repo: ./external/wesep-real-tse
  wesep_checkpoint: ./pretrained/wesep/spk_emb_100
  cosyvoice_repo: ./external/CosyVoice
  cosyvoice3_model: ./pretrained/Fun-CosyVoice3-0.5B
  qwen_model: ./pretrained/Qwen2.5-0.5B-Instruct
  wavlm_model: ./pretrained/wavlm-base-plus
  evase_checkpoint: null

data:
  librispeech_root: external/LibriSpeech
  librimix_repo: external/LibriMix
  librimix_root: external/LibriMix/Libri2Mix
  wham_root: external/wham_noise
  train_split: external/LibriMix/Libri2Mix/wav16k/min/train-100
  dev_split: external/LibriMix/Libri2Mix/wav16k/min/dev
  test_split: external/LibriMix/Libri2Mix/wav16k/min/test
  train_manifest: ./manifests/tse_train.jsonl
  dev_manifest: ./manifests/tse_dev.jsonl
  test_manifest: ./manifests/tse_test.jsonl
  debug_manifest: ./debug_manifests/tse_debug_4trials.jsonl
  debug_prepared_manifest: ./debug_manifests/tse_debug_4trials_prepared.jsonl
  train_prepared_manifest: ./manifests/tse_train_prepared.jsonl
  dev_prepared_manifest: ./manifests/tse_dev_prepared.jsonl
  test_prepared_manifest: ./manifests/tse_test_prepared.jsonl
  train_enrollment_strategy: librispeech_same_speaker
  dev_enrollment_map: ./datasets/enrollment_maps/dev_mixture2enrollment
  test_enrollment_map: ./datasets/enrollment_maps/test_mixture2enrollment

audio:
  sample_rate: 16000
  channels: 1
  librimix_frequency: 16k
  librimix_mode: min
  librimix_type: mix_clean
