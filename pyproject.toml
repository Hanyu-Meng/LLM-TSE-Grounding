[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tse-grounding"
version = "0.1.0"
description = "Reference implementations for confusion repair and grounded generation in LLM-based target speaker extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
pipeline = [
  "PyYAML>=6",
  "soundfile>=0.12",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyloudnorm>=0.1.1",
  "librosa>=0.10",
  "jiwer>=3.0",
  "pesq>=0.0.4",
  "pystoi>=0.4",
  "pyarrow>=14",
  "tensorboard>=2.14",
  "torch>=2.1",
  "transformers>=4.40",
]

[project.scripts]
llm-tse-grounding = "llm_tse_grounding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
